name: Novel workbench
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - name: Install writing dependencies
        run: pnpm install --filter @openwork/app... --filter @openwork/desktop... --frozen-lockfile --ignore-scripts
      - name: Workflow and filesystem tests
        run: pnpm writing:test
      - name: Production build and typecheck
        run: pnpm writing:build
      - uses: actions/upload-artifact@v4
        with:
          name: writing-ui-${{ matrix.os }}
          path: apps/app/dist-writing
